<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>את לא כמו כולם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600&display=swap">
<style>
/* Layout: full-screen volume gate, then one tall scroll of photos with the song playing */
:root {
  --bg: #14121a;
  --surface: #1e1b26;
  --fg: #f3eee6;
  --muted: #9a93a6;
  --accent: #f0a868;
  --line: #2c2836;
  --display: "Suez One", "Frank Ruhl Libre", Georgia, serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.6;
  direction: rtl; margin: 0;
}

/* ---------- gate ---------- */
#gate {
  position: fixed; inset: 0; z-index: 10;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; padding: 24px 16px; text-align: center;
  transition: opacity .8s ease, visibility .8s;
}
#gate.gone { opacity: 0; visibility: hidden; }
.speaker { width: 96px; height: 96px; color: var(--accent); }
.speaker .wave { opacity: .2; animation: wave 1.8s infinite; }
.speaker .w2 { animation-delay: .3s; }
.speaker .w3 { animation-delay: .6s; }
@keyframes wave { 0%,100% { opacity: .2 } 40% { opacity: 1 } }
#gate h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(30px, 8vw, 44px); line-height: 1.2; margin: 0;
  text-wrap: balance;
}
#gate p { margin: 0; color: var(--muted); max-width: 30ch; }
.gate-text { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#gate .eyebrow { color: var(--accent); font-size: 18px; letter-spacing: .03em; }
#go {
  font: 600 20px var(--body); color: var(--bg); background: var(--accent);
  border: 0; border-radius: 999px; padding: 16px 44px; cursor: pointer;
  box-shadow: 0 0 0 0 rgba(240,168,104,.5); animation: pulse 2s infinite;
}
#go:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
#go:active { transform: scale(.97); }
@keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(240,168,104,0) } 100% { box-shadow: 0 0 0 0 rgba(240,168,104,0) } }

/* ---------- story ---------- */
main { max-width: 560px; margin: 0 auto; padding-block: 48px 96px; padding-inline: 16px;
  display: flex; flex-direction: column; gap: 56px; }
.intro { text-align: center; padding-block: 18vh 4vh; }
.intro h2 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 10vw, 54px);
  line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
.intro span { color: var(--muted); font-size: 15px; letter-spacing: .04em; }
.intro .down { display: block; margin-top: 28px; color: var(--accent); font-size: 26px; animation: bob 2s infinite; }
@keyframes bob { 50% { transform: translateY(8px) } }

figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
figure img { width: 100%; border-radius: 14px; display: block; }
.ph {
  aspect-ratio: 3 / 4; max-width: 100%; border-radius: 14px;
  border: 1.5px dashed var(--line); background: var(--surface);
  display: grid; place-items: center; color: var(--muted); font-size: 15px;
}
figcaption { text-align: center; color: var(--muted); font-size: 16px; }

.end { text-align: center; font-family: var(--display); font-size: 30px; padding-block: 8vh; }


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<section id="gate" role="dialog" aria-labelledby="gate-title">
  <svg class="speaker" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 38h14l18-14v48L28 58H14z" fill="currentColor" fill-opacity=".15"/>
    <path class="wave w1" d="M58 40a12 12 0 0 1 0 16"/>
    <path class="wave w2" d="M66 32a24 24 0 0 1 0 32"/>
    <path class="wave w3" d="M74 24a36 36 0 0 1 0 48"/>
  </svg>
  <div class="gate-text">
    <p class="eyebrow">קיבלת מסר משולח סודי</p>
    <h1 id="gate-title">תפעילי סאונד</h1>
  </div>
  <button id="go" type="button">הגברתי</button>
</section>

<main>
  <header class="intro">
    <span class="down" aria-hidden="true">↓</span>
  </header>

  <figure><img src="photos/1.webp" alt="מכתב, עמוד 1"></figure>
  <figure><img src="photos/2.webp" alt="מכתב, עמוד 2"></figure>
  <figure><img src="photos/3.webp" alt="מכתב, עמוד 3"></figure>

</main>

<audio id="song" src="song.mp3" preload="auto" loop playsinline></audio>

<script>
const song = document.getElementById('song');
const gate = document.getElementById('gate');

// Always open the letter from the top: no restored scroll, no scrolling behind the gate.
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
document.documentElement.style.overflow = 'hidden';
window.scrollTo(0, 0);

// Phones block sound until the first touch, so: try right away, then again on any touch.
function start() {
  song.volume = 1;
  if (song.paused) song.play().catch(() => {});
}
start();
['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, start, { once: true, passive: true }));

document.getElementById('go').addEventListener('click', () => {
  start();
  window.scrollTo(0, 0);
  document.documentElement.style.overflow = '';
  gate.classList.add('gone');
});

</script>
</body>
</html>
